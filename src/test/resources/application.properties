# Configuracao usada apenas pelos testes que sobem contexto Spring.
#
# Os testes de repositorio (@DataJpaTest) rodam contra um H2 em memoria no modo de
# compatibilidade com PostgreSQL, para aceitar os mesmos tipos de coluna usados em
# producao (TEXT, por exemplo). O schema sai das proprias entidades, entao o Flyway
# fica desligado: as migracoes sao escritas em dialeto PostgreSQL.
spring.datasource.url=jdbc:h2:mem:crmdb_teste;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

# Valores de fachada: nenhum teste chama o Telegram de verdade, o client e mockado.
telegram.bot.token=token-de-teste
telegram.bot.chat-id=0
