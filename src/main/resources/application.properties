spring.application.name=sistema-crm

# ---------------------------------------------------------------------------
# Nenhuma credencial fica neste arquivo: tudo o que e sensivel vem de variaveis
# de ambiente. Na EC2 elas ficam em /etc/crm/crm.env, gerado pelo deploy/setup.sh.
# Para rodar localmente, veja o .env.example na raiz do projeto.
# ---------------------------------------------------------------------------

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crmdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

# JWT: a chave precisa ter no minimo 32 caracteres (256 bits para o HMAC-SHA256).
# A expiracao padrao e de 2 horas.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# Origens autorizadas pelo CORS, separadas por virgula.
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Administrador criado na primeira execucao, apenas se ainda nao houver nenhum.
admin.nome=${ADMIN_NOME:Administrador}
admin.email=${ADMIN_EMAIL:}
admin.senha=${ADMIN_PASSWORD:}

# Notificacoes do Telegram: opcionais. Sem token, o envio e simplesmente ignorado.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID:}

# A autenticacao e feita pelo JWT: o usuario em memoria que o Spring Boot criaria
# por padrao (com senha impressa no log) nao e usado.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.crmapi.sistemacrm.controller
springdoc.override-with-generic-response=false
