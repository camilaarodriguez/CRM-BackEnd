# CRM - Nginx na porta 80: entrega o build do Angular e repassa a API.
# Instalado pelo deploy/setup.sh em /etc/nginx/sites-available/crm.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/crm;
    index index.html;

    client_max_body_size 5m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API Spring Boot, que escuta apenas em 127.0.0.1:8080 (a porta 8080 nao e exposta).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Documentacao da API (Swagger UI e OpenAPI).
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O index.html nunca fica em cache: assim um novo deploy aparece na hora.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Fallback das rotas SPA: /clientes, /conversas/5 etc. devolvem o index.html
    # e o roteador do Angular resolve a tela no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
